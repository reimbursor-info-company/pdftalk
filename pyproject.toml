[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdftalk"
version = "0.2.7"
description = "Converts PDF files into audio (text-to-speech) for accessibility for visually impaired people"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Reimbursor company" }]
keywords = ["pdf", "text-to-speech", "tts", "accessibility", "audio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
]
dependencies = [
    "pypdf>=4.0.0",
    "pyttsx3>=2.90",
    "cryptography",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pdftalk = "pdftalk.cli:main"

[project.urls]
Homepage = "https://github.com/reimbursor-info-company/pdftalk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdftalk = [
    "*.pyd",
    "**/*.pyd",
]
